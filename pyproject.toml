[project]
name = "mitre-attack-mcp"
version = "0.1.0"
description = "MITRE ATT&CK MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "gsbadhan" }]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
mitre-attack-mcp = "mitre_attack_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitre_attack_mcp"]
include = ["data"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mcptest>=0.1.1",
]
