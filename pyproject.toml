[project]
name = "mitre-attack-mcp"
version = "0.1.4"
description = "MITRE ATT&CK MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "gsbadhan" }]
keywords = ["mcp", "mitre-attack", "threat-intelligence", "cybersecurity", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
mitre-attack-mcp = "mitre_attack_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitre_attack_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mcptest>=0.1.1",
]
